name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - setup-android-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Native build and Android self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test native reconciliation engine
        run: |
          mkdir -p build/native-tests
          javac -encoding UTF-8 -d build/native-tests app/src/main/java/ru/slavitsa/sverkapro/core/*.java tools/NativeEngineTest.java
          java -cp build/native-tests NativeEngineTest

      - name: Build native APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug

      - name: Prepare APK artifact
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          cp app/build/outputs/apk/debug/app-debug.apk Sverka-PRO-2.0.2-column-fix.apk
          sha256sum Sverka-PRO-2.0.2-column-fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sverka-PRO-2.0.2-Column-Fix
          path: Sverka-PRO-2.0.2-column-fix.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Test result rendering on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run_native_selftest.sh
