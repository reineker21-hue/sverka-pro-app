name: Android Runtime Crash Test

on:
  push:
    branches:
      - setup-android-build
    paths:
      - '.github/workflows/android-runtime-test.yml'
      - 'main.py'
      - 'reconcile_core.py'
      - 'prebuild_patch.py'
      - 'smart_patch.py'
      - 'automation_patch.py'
      - 'fns_protocol_patch.py'
      - 'stable_runtime_patch.py'
      - 'android_selftest_patch.py'
      - 'buildozer.spec'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    name: Compare button on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Rust and Buildozer
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer 'cython==0.29.36' pillow

      - name: Prepare x86_64 Android self-test build
        run: |
          python prebuild_patch.py
          python smart_patch.py
          python automation_patch.py
          python fns_protocol_patch.py
          python stable_runtime_patch.py
          python android_selftest_patch.py
          python generate_assets.py
          python -m py_compile main.py reconcile_core.py
          python runtime_smoke_test.py
          sed -i 's/android.archs = arm64-v8a/android.archs = x86_64/' buildozer.spec

      - name: Build x86_64 test APK
        run: buildozer -v android debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run compare self-test in Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK=$(find bin -maxdepth 1 -name '*.apk' -print -quit)
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop ru.slavitsa.sverkapro || true
            adb shell am start -W -n ru.slavitsa.sverkapro/org.kivy.android.PythonActivity --es sverka_selftest 1
            for i in $(seq 1 30); do
              adb logcat -d > /tmp/sverka-logcat.txt
              if grep -q 'SVERKA_SELFTEST_OK' /tmp/sverka-logcat.txt; then break; fi
              if grep -E 'SVERKA_SELFTEST_FAIL|FATAL EXCEPTION|Fatal Python error|SIGSEGV|ANR in ru.slavitsa.sverkapro' /tmp/sverka-logcat.txt; then
                cat /tmp/sverka-logcat.txt
                exit 1
              fi
              sleep 1
            done
            if ! grep -q 'SVERKA_SELFTEST_OK' /tmp/sverka-logcat.txt; then
              cat /tmp/sverka-logcat.txt
              exit 1
            fi
            PID=$(adb shell pidof ru.slavitsa.sverkapro | tr -d '\r')
            test -n "$PID"
            ! grep -E 'SVERKA_SELFTEST_FAIL|FATAL EXCEPTION|Fatal Python error|SIGSEGV|ANR in ru.slavitsa.sverkapro' /tmp/sverka-logcat.txt
            echo "ANDROID_COMPARE_SELFTEST_OK pid=$PID"
